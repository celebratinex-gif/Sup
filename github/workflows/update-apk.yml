name: Auto Update Sup.zip

on:
  push:
    branches:
      - main

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Simulate Building and Renaming to Sup.zip
        run: |
          if [ ! -f "Sup.zip" ]; then
            echo "Dummy build content" > Sup.zip
          fi

      - name: Force Update main branch file
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update Sup.zip [skip ci]"
          file_pattern: "Sup.zip"
          
